/* Gestaltung: eine Spieltag-Übertragung auf dem Handy. Oben die Anzeigetafel (Spielstand), darunter die
   Aufgaben als Spielzüge, unten eine Tab-Leiste wie in einer Vereins-App. Nachtstadion: Rasenstreifen,
   Flutlicht von oben, Neon-Limette für Tore, Gold für Pokale, Orange für Serien, Wasserblau für den Fang.
   Bewusst nur dieses eine Aussehen (kein heller Modus): Es soll nach Stadionabend aussehen. */
:root {
  color-scheme: dark;
  --bg: #06110b;
  --panel: rgba(13, 31, 21, .8);
  --panel-solid: #0f2218;
  --panel-2: #173522;
  --line: rgba(255, 255, 255, .12);
  --line-2: rgba(255, 255, 255, .24);
  --ink: #f4fbf1;
  --ink-2: #c0d8c6;
  --ink-3: #8aab94;
  --lime: #c6ff3d;
  --lime-deep: #6fae10;
  --lime-ink: #0b2404;
  --ember: #ff8a1f;
  --gold: #ffd23c;
  --silver: #d5dde7;
  --bronze: #e09a5b;
  --water: #38c9f2;
  --red: #ff5a52;
  --yellow: #ffd60a;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --sh: 0 12px 32px rgba(0, 0, 0, .4);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.35;
  -webkit-tap-highlight-color: transparent; overflow-x: hidden; min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
body.noscroll { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:disabled { cursor: default; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(90% 46% at 50% -8%, rgba(196, 255, 120, .24), transparent 62%),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .03) 0 46px, transparent 46px 92px),
    linear-gradient(180deg, #0c2c1a 0%, #071b10 52%, #050e09 100%);
}
#app, #layer, #celeb, #toast { position: relative; z-index: 1; }
/* Web-App: Der Kopf klebt unterhalb der Statusleiste (top: env(…)). Sein Platz im Fluss muss schon dort liegen, sonst schiebt das Kleben ihn beim Start über die ersten Pixel des Inhalts. (Die Claude-Seite bringt diesen Abstand über ihr Grundgerüst mit.) */
.pwa #app { padding-top: env(safe-area-inset-top, 0px); }
.wrap { width: 100%; max-width: 580px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main { padding-top: 6px; padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; }
.disp { font-family: var(--f-display); font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; }
.eyebrow { font: 700 12px var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.hint { color: var(--ink-2); font-size: 14.5px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--sh); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.pad { padding: 16px; }

/* ---------- Ladeanzeige ---------- */
.boot { min-height: 70vh; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; padding: 24px; }
.boot .ball { animation: hop 0.9s cubic-bezier(.3, .0, .4, 1) infinite; filter: drop-shadow(0 10px 8px rgba(0, 0, 0, .45)); }
.boot p { font: 800 italic 22px var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
@keyframes hop { 0%, 100% { transform: translateY(0) } 45% { transform: translateY(-46px) rotate(180deg) } }

/* ---------- Kopf ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: linear-gradient(180deg, rgba(6, 17, 11, .94), rgba(6, 17, 11, .78)); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 9px; padding-bottom: 9px; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who .crest-svg { display: block; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .45)); }
.who-tx { display: grid; min-width: 0; }
.nm { font: 900 italic 26px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; align-items: center; gap: 7px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 10px; border-radius: 999px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); font: 900 italic 20px/1 var(--f-display); color: var(--ink); }
.chip svg { width: 20px; height: 20px; flex: none; }
.chip.fire { color: var(--ember); }
.chip.fire b { color: var(--ink); }
.lockbtn { width: 36px; padding: 0; justify-content: center; color: var(--ink-2); }
.lockbtn.on { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }

/* ---------- Tab-Leiste ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 55; background: rgba(6, 17, 11, .95); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 580px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 6px max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); }
.tab { display: grid; justify-items: center; gap: 2px; padding: 7px 2px 5px; border: 0; background: none; color: var(--ink-3); font: 700 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; border-radius: 14px; position: relative; }
.tab svg { width: 27px; height: 27px; }
.tab[aria-current="page"] { color: var(--lime); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -7px; left: 22%; right: 22%; height: 3px; border-radius: 0 0 4px 4px; background: var(--lime); box-shadow: 0 0 14px var(--lime); }
.tab .dot-badge { position: absolute; top: 4px; right: calc(50% - 22px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--red); color: #fff; font: 800 11px/17px var(--f-body); text-align: center; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px; border-radius: 999px; border: 0; font: 900 italic 20px/1 var(--f-display); text-transform: uppercase; letter-spacing: .05em; position: relative; }
.btn svg { width: 20px; height: 20px; }
.btn-lime { background: var(--lime); color: var(--lime-ink); box-shadow: 0 6px 0 var(--lime-deep), 0 14px 26px rgba(198, 255, 61, .22); transition: transform .08s, box-shadow .08s; }
.btn-lime:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--lime-deep), 0 6px 14px rgba(198, 255, 61, .18); }
.btn-ghost { background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); }
.btn-ghost:active { background: rgba(255, 255, 255, .16); }
.btn-danger { background: var(--red); color: #2a0705; box-shadow: 0 6px 0 #a02a25; }
.btn-danger:active { transform: translateY(4px); box-shadow: 0 2px 0 #a02a25; }
.btn-sm { min-height: 42px; padding: 0 16px; font-size: 17px; }
.btn-block { width: 100%; }
.tag { display: inline-block; vertical-align: 2px; margin-left: 4px; padding: 3px 8px 2px; border-radius: 8px; background: rgba(255, 255, 255, .12); font: 800 12px/1 var(--f-body); letter-spacing: .06em; color: var(--ink-2); }
.tag.bonus { background: rgba(255, 210, 60, .18); color: var(--gold); }

/* ---------- Tagesleiste ---------- */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
.pill { position: relative; display: grid; justify-items: center; gap: 1px; padding: 8px 0 9px; border-radius: 15px; border: 1px solid var(--line); background: rgba(255, 255, 255, .045); color: var(--ink-2); }
.pill .wd { font: 800 12.5px var(--f-display); letter-spacing: .12em; text-transform: uppercase; }
.pill .dn { font: 900 italic 23px/1 var(--f-display); color: var(--ink); }
.pill .st { height: 10px; margin-top: 3px; display: grid; place-items: center; }
.pill.sel { border-color: var(--lime); background: rgba(198, 255, 61, .13); box-shadow: 0 0 0 1px var(--lime) inset, 0 0 22px rgba(198, 255, 61, .16); }
.pill.today .wd { color: var(--lime); }
.pill.fut { opacity: .38; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: block; }
.dot.win { background: var(--lime); }
.dot.draw { background: var(--ink-3); }
.dot.loss { background: var(--ember); }
.dot.none { border: 1.5px solid var(--line-2); }
.dot.perfect { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.dot.off { background: none; border: 1.5px dashed var(--ink-3); }
.back-today { justify-self: start; }

/* ---------- Anzeigetafel ---------- */
.score { position: relative; overflow: hidden; padding: 16px 16px 18px; border-color: rgba(198, 255, 61, .28); background: linear-gradient(160deg, #12361f, #0a1d13 70%); }
.score > * { position: relative; }
.score.perfect { border-color: var(--gold); box-shadow: var(--sh), 0 0 40px rgba(255, 210, 60, .18); }
.score-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.score-top .date { font: 800 italic 20px var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.badge { display: inline-block; padding: 5px 10px 4px; border-radius: 8px; font: 900 italic 14px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; background: rgba(255, 255, 255, .1); color: var(--ink-2); }
.badge.win { background: var(--lime); color: var(--lime-ink); }
.badge.perfect { background: var(--gold); color: #3a2a00; }
.badge.loss { background: rgba(255, 138, 31, .22); color: #ffc58a; }
.badge.draw { background: rgba(255, 255, 255, .16); color: var(--ink); }
.board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin: 8px 0 4px; }
.team { display: grid; justify-items: center; gap: 4px; min-width: 0; }
.team .tn { font: 800 13px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); text-align: center; overflow-wrap: anywhere; line-height: 1.15; }
.digits { display: flex; align-items: center; gap: 8px; font: 900 italic 92px/.9 var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; }
.digits .nv { color: var(--lime); text-shadow: 0 0 26px rgba(198, 255, 61, .5), 0 3px 0 rgba(0, 0, 0, .4); }
.digits .colon { font-size: 64px; color: var(--ink-2); text-shadow: none; transform: translateY(-4px); }
.digits .rv { color: var(--ember); text-shadow: 0 0 22px rgba(255, 138, 31, .4), 0 3px 0 rgba(0, 0, 0, .4); }
.digits .pop { animation: popnum .5s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes popnum { 0% { transform: scale(1) } 35% { transform: scale(1.35) } 100% { transform: scale(1) } }
.pips { display: flex; justify-content: center; gap: 7px; margin: 4px 0 8px; flex-wrap: wrap; }
.pip { width: 26px; height: 8px; border-radius: 5px; background: rgba(255, 255, 255, .14); }
.pip.y { background: var(--lime); box-shadow: 0 0 10px rgba(198, 255, 61, .5); }
.pip.n { background: var(--ember); }
.pip.b { background: var(--gold); box-shadow: 0 0 10px rgba(255, 210, 60, .5); }
.msg { text-align: center; font: 700 italic 19px/1.2 var(--f-display); letter-spacing: .02em; color: var(--ink); text-wrap: balance; }
.msg small { display: block; margin-top: 2px; font: 600 13.5px var(--f-body); letter-spacing: 0; color: var(--ink-2); font-style: normal; }

.fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 8px; background: linear-gradient(90deg, #7fd11a, var(--lime)); box-shadow: 0 0 16px rgba(198, 255, 61, .6); transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }
.troph.bronze { color: var(--bronze); }
.troph.silver { color: var(--silver); }
.troph.gold { color: var(--gold); }

/* ---------- Aufgaben ---------- */
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 2px 2px 0; }
.sec-h h2 { font: 900 italic 24px var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.tasks { display: grid; gap: 10px; }
.task { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); position: relative; overflow: hidden; }
.task .ico { width: 54px; height: 54px; border-radius: 17px; display: grid; place-items: center; font-size: 29px; background: linear-gradient(145deg, #21502f, #143323); border: 1px solid var(--line-2); }
.task .tx { min-width: 0; }
.task h3 { font: 800 italic 22px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.task p { margin-top: 3px; color: var(--ink-2); font-size: 14px; line-height: 1.25; }
.task.st-y { border-color: rgba(198, 255, 61, .65); background: linear-gradient(135deg, rgba(198, 255, 61, .17), rgba(13, 31, 21, .85) 70%); }
.task.st-n { border-color: rgba(255, 138, 31, .5); background: linear-gradient(135deg, rgba(255, 138, 31, .12), rgba(13, 31, 21, .85) 70%); }
.task.st-x { opacity: .55; }
.task.bonus { border-style: dashed; border-color: rgba(255, 210, 60, .5); }
.task.bonus.st-y { border-style: solid; border-color: var(--gold); background: linear-gradient(135deg, rgba(255, 210, 60, .2), rgba(13, 31, 21, .85) 70%); }
.task.shake { animation: shake .4s; }
.stamp-wrap { width: 68px; height: 68px; display: grid; place-items: center; }
.stamp { width: 66px; height: 66px; border-radius: 50%; border: 3px solid currentColor; display: grid; place-content: center; justify-items: center; gap: 1px; text-align: center; font: 900 italic 13px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; transform: rotate(-10deg); }
.stamp svg { width: 26px; height: 26px; }
.stamp.y { color: var(--lime); background: rgba(198, 255, 61, .1); }
.stamp.y.gold { color: var(--gold); background: rgba(255, 210, 60, .1); }
.stamp.n { color: var(--ember); background: rgba(255, 138, 31, .08); }
.stamp.x { color: var(--ink-3); border-style: dashed; }
.stamp.o { color: var(--ink-3); border-style: dashed; border-width: 2px; opacity: .8; }
.task.fx .stamp.y, .task.fx .stamp.n { animation: slam .55s cubic-bezier(.2, .9, .3, 1.2) both; }
.task.fx .stamp.y::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid var(--lime); animation: ring .6s ease-out both; }
.stamp { position: relative; }
@keyframes slam { 0% { transform: rotate(-26deg) scale(3.2); opacity: 0 } 55% { transform: rotate(-8deg) scale(.9); opacity: 1 } 78% { transform: rotate(-12deg) scale(1.08) } 100% { transform: rotate(-10deg) scale(1) } }
@keyframes ring { 0% { transform: scale(.8); opacity: .9 } 100% { transform: scale(2.1); opacity: 0 } }
@keyframes shake { 0%, 100% { transform: translateX(0) } 20% { transform: translateX(-7px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(3px) } }
.seg { grid-column: 1 / -1; display: grid; grid-template-columns: 1.3fr 1.1fr 1fr; gap: 8px; margin-top: 2px; }
.seg.one { grid-template-columns: 1fr; }
.seg.two { grid-template-columns: 1fr 1fr; }
.seg button { min-height: 48px; border-radius: 14px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .07); display: flex; align-items: center; justify-content: center; gap: 6px; font: 800 italic 16px/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.seg button svg { width: 18px; height: 18px; }
.seg button:active { transform: scale(.97); }
.seg .b-y[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
.seg .b-g[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #3a2a00; }
.seg .b-n[aria-pressed="true"] { background: var(--ember); border-color: var(--ember); color: #2a1200; }
.seg .b-x[aria-pressed="true"] { background: #4b6654; border-color: #4b6654; color: #fff; }

.day-tools { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Extras, Karten, Verwarnungskonto ---------- */
.extras { padding: 14px 16px 16px; display: grid; gap: 12px; }
.xbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.xbtn { display: grid; justify-items: center; gap: 5px; padding: 12px 4px 10px; border-radius: 16px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .06); font: 800 italic 15px/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.xbtn:active { transform: scale(.97); }
.xbtn .ball, .xbtn .card-ic { height: 30px; width: auto; }
.evs { display: grid; gap: 8px; }
.ev { display: grid; grid-template-columns: 30px 1fr auto auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); }
.ev.good { border-color: rgba(198, 255, 61, .4); }
.ev.red { border-color: rgba(255, 90, 82, .55); background: rgba(255, 90, 82, .1); }
.ev.yellow { border-color: rgba(255, 214, 10, .5); background: rgba(255, 214, 10, .08); }
.ev .evi { display: grid; place-items: center; }
.ev .evt { min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.ev .evt small { display: block; color: var(--ink-3); font-weight: 500; font-size: 12.5px; }
.ev .evv { font: 900 italic 20px var(--f-display); }
.ev.good .evv { color: var(--lime); }
.ev.red .evv { color: var(--red); }
.ev.yellow .evv { color: var(--yellow); }
.evx { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); display: grid; place-items: center; color: var(--ink-2); }
.evx svg { width: 15px; height: 15px; }
.acct { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; padding: 12px 14px; border-radius: 18px; background: rgba(255, 214, 10, .07); border: 1px solid rgba(255, 214, 10, .3); }
.acct .slots { display: flex; gap: 6px; }
.acct .slot { width: 30px; height: 40px; border-radius: 7px; display: grid; place-items: center; border: 2px dashed rgba(255, 214, 10, .4); }
.acct .slot .card-ic { width: 26px; height: auto; }
.acct .slot.on { border-style: solid; border-color: transparent; background: none; }
.acct b { font: 900 italic 17px var(--f-display); text-transform: uppercase; letter-spacing: .04em; color: var(--yellow); }
.acct .acct-t { font-size: 13.5px; color: var(--ink-2); line-height: 1.3; }
.acct .acct-h { display: grid; gap: 2px; }
.card-ic.yellow { color: var(--yellow); }
.card-ic.red { color: var(--red); }

/* ---------- Woche ---------- */
.wk-nav { display: grid; grid-template-columns: 46px 1fr 46px; align-items: center; gap: 8px; }
.wk-nav .mid { text-align: center; }
.wk-nav .mid b { display: block; font: 900 italic 24px var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.navbtn { width: 46px; height: 46px; border-radius: 15px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .07); display: grid; place-items: center; }
.navbtn svg { width: 22px; height: 22px; }
.navbtn:disabled { opacity: .3; }
.tiers { display: grid; gap: 10px; }
.tier { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); }
.tier .troph { width: 48px; height: 48px; opacity: .5; filter: grayscale(.7); }
.tier.got { border-color: rgba(255, 210, 60, .55); background: linear-gradient(135deg, rgba(255, 210, 60, .14), rgba(13, 31, 21, .85) 70%); }
.tier.got .troph { opacity: 1; filter: drop-shadow(0 0 10px currentColor); }
.tier h3 { font: 900 italic 21px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.tier p { margin-top: 2px; color: var(--ink-2); font-size: 14.5px; }
.tier .state { margin-top: 6px; font: 800 12.5px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.tier.got .state { color: var(--lime); }
.tier.done .state { color: var(--ink-3); }
.tier .btn { margin-top: 8px; }
.wk-days { display: grid; gap: 8px; }
.wk-day { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); text-align: left; width: 100%; }
.wk-day.today { border-color: var(--lime); }
.wk-day.fut { opacity: .4; }
.wk-day .d { display: grid; justify-items: center; line-height: 1; }
.wk-day .d b { font: 900 italic 24px var(--f-display); }
.wk-day .d span { font: 800 12px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.wk-day .balls { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; min-height: 22px; }
.wk-day .balls .ball { width: 20px; height: 20px; }
.wk-day .balls .ghost { opacity: .22; }
.wk-day .balls em { font: 600 13px var(--f-body); font-style: normal; color: var(--ink-3); }
.wk-day .res { display: flex; align-items: center; gap: 8px; font: 900 italic 22px var(--f-display); font-variant-numeric: tabular-nums; }
.stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { display: grid; justify-items: center; gap: 2px; padding: 12px 4px 10px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); text-align: center; }
.stat b { font: 900 italic 30px/1 var(--f-display); color: var(--gold); font-variant-numeric: tabular-nums; }
.stat span { font: 700 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); line-height: 1.15; }

/* ---------- Erfolge: Fang, Ziele, Sticker ---------- */
.fang-card { overflow: hidden; }
.fang-svg { display: block; width: 100%; height: auto; }
.fang-svg .wv { animation: drift 7s linear infinite; }
.fang-svg .w2 { animation-duration: 10s; animation-direction: reverse; }
.fang-svg .w3 { animation-duration: 13s; }
@keyframes drift { to { transform: translateX(-48px); } }
.fang-svg .bb { animation: rise 4.5s ease-in infinite; }
.fang-svg .b2 { animation-delay: 1.4s; }
.fang-svg .b3 { animation-delay: 2.8s; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: .9 } 100% { transform: translateY(-70px); opacity: 0 } }
.fang-svg .fish-bob { animation: bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0) } 50% { transform: translateY(-2.5px) rotate(1.8deg) } }
.fang-svg .splash, .fang-svg .drops { opacity: 0; }
.fang-svg.caught .splash { opacity: 1; }
.fang-svg.caught .drops { opacity: 1; animation: drops 1.6s ease-out infinite; }
.fang-svg .sp { transform-box: fill-box; transform-origin: center; }
.fang-svg.caught .sp { animation: spl 2s ease-out infinite; }
.fang-svg.caught .s2 { animation-delay: .5s; }
@keyframes spl { 0% { transform: scale(.4); opacity: .9 } 100% { transform: scale(1.5); opacity: 0 } }
@keyframes drops { 0% { transform: translateY(6px); opacity: 0 } 30% { opacity: 1 } 100% { transform: translateY(-10px); opacity: 0 } }
.fang-meta { padding: 14px 16px 16px; display: grid; gap: 10px; }
.fang-meta .top-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.fang-meta h2 { font: 900 italic 26px/1 var(--f-display); text-transform: uppercase; }
.fang-meta .pct { font: 900 italic 30px/1 var(--f-display); color: var(--water); font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 14px; border-radius: 8px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.bar .fill.water { background: linear-gradient(90deg, #1f9fd0, var(--water)); box-shadow: 0 0 16px rgba(56, 201, 242, .55); }
.reward-box { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: rgba(255, 210, 60, .1); border: 1px solid rgba(255, 210, 60, .35); }
.reward-box .gift { font-size: 30px; line-height: 1; }
.reward-box b { display: block; font: 800 12px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.reward-box span { font-weight: 600; }
.album { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sticker { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; padding: 4px; display: grid; background: #16301f; border: 1px solid var(--line); text-align: center; overflow: hidden; }
.sticker .in { border-radius: 10px; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; justify-items: center; align-content: center; gap: 4px; padding: 8px 4px 8px; background: #0c1b13; }
.sticker .no { font: 700 9px var(--f-body); letter-spacing: .1em; color: var(--ink-3); }
.sticker .em { font-size: 30px; line-height: 1; align-self: center; }
.sticker .em .spc { display: block; width: 1.5em; height: auto; margin: 0 auto; overflow: visible; }
.sheet .sub.fact { margin-top: 0; color: var(--ink); font-weight: 600; }
.ce-sub.fact { font-size: 15px; max-width: 30ch; margin-inline: auto; }
.sticker .nm2 { font: 800 italic 12px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .02em; color: var(--ink-3); text-wrap: balance; }
.sticker.lock .em { filter: grayscale(1) brightness(.35); }
.sticker.lock .em::after { content: ""; }
.sticker.got { background: linear-gradient(135deg, #ffe58a, #ff9a3c 40%, #ffe58a 60%, #ff9a3c); border-color: transparent; box-shadow: 0 8px 20px rgba(255, 170, 60, .22); }
.sticker.got .in { background: linear-gradient(180deg, #fffdf2, #fff1c4); }
.sticker.got .no { color: #8a6a1a; }
.sticker.got .nm2 { color: #3a2a06; }
.sticker.got::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, .55) 48%, transparent 58%); transform: translateX(-120%); animation: shine 5.5s ease-in-out infinite; pointer-events: none; }
@keyframes shine { 0%, 62% { transform: translateX(-120%) } 85%, 100% { transform: translateX(120%) } }
.sticker.new { animation: popnum .7s cubic-bezier(.2, 1.5, .4, 1); }

/* ---------- Trainer ---------- */
.gate { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 34px 20px; }
.gate .lockbig { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: rgba(198, 255, 61, .12); border: 2px solid var(--lime); color: var(--lime); }
.gate .lockbig svg { width: 38px; height: 38px; }
.gate h2 { font: 900 italic 28px var(--f-display); text-transform: uppercase; }
.coach-sec { padding: 16px; display: grid; gap: 14px; }
.coach-sec > h2 { font: 900 italic 24px var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.field { display: grid; gap: 6px; }
.field > span, .lab { font: 700 12.5px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.field small { color: var(--ink-3); font-size: 13px; }
input[type="text"], input[type="tel"], input[type="number"], textarea { width: 100%; min-height: 48px; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .07); color: var(--ink); font: 600 16px var(--f-body); }
textarea { min-height: 104px; resize: vertical; line-height: 1.35; }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.trow { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 10px 12px; border-radius: 16px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); text-align: left; }
.trow .ico { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; font-size: 24px; background: #15301f; }
.trow b { display: block; font: 800 italic 18px/1.1 var(--f-display); text-transform: uppercase; }
.trow span.s { font-size: 13px; color: var(--ink-3); }
.trow svg { width: 20px; height: 20px; color: var(--ink-3); transform: rotate(90deg); }
.trow.open svg { transform: rotate(-90deg); }
.tedit { display: grid; gap: 14px; padding: 14px; border-radius: 16px; border: 1px solid var(--line-2); background: rgba(0, 0, 0, .22); margin-top: -4px; }
.emojis { display: flex; flex-wrap: wrap; gap: 6px; }
.emojis button { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); font-size: 22px; }
.emojis button[aria-pressed="true"] { border-color: var(--lime); background: rgba(198, 255, 61, .15); }
.dchips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dchips button { min-height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .06); font: 800 14px var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.dchips button[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
.stepper { display: inline-grid; grid-template-columns: 46px minmax(54px, auto) 46px; align-items: center; border-radius: 14px; border: 1px solid var(--line-2); overflow: hidden; background: rgba(255, 255, 255, .06); }
.stepper button { height: 46px; border: 0; background: rgba(255, 255, 255, .08); font: 900 24px var(--f-display); }
.stepper output { text-align: center; font: 900 italic 22px var(--f-display); font-variant-numeric: tabular-nums; padding: 0 8px; }
.switch { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); width: 100%; text-align: left; }
.switch b { display: block; font-weight: 700; }
.switch small { color: var(--ink-3); font-size: 13px; line-height: 1.3; display: block; margin-top: 2px; }
.sw { width: 54px; height: 32px; border-radius: 16px; background: rgba(255, 255, 255, .18); position: relative; transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] .sw { background: var(--lime); }
.switch[aria-checked="true"] .sw::after { transform: translateX(22px); background: var(--lime-ink); }
.rules { display: grid; gap: 8px; font-size: 14.5px; color: var(--ink-2); }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.rules li svg { width: 22px; height: 22px; margin-top: 1px; }
.rules b { color: var(--ink); }
.warn-box { padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(255, 138, 31, .5); background: rgba(255, 138, 31, .1); font-size: 14.5px; display: grid; gap: 8px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Fenster (Sheet) und Code-Eingabe ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 70; background: rgba(0, 4, 2, .68); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .2s both; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 71; max-width: 580px; margin: 0 auto; max-height: 92vh; max-height: 92dvh; overflow: auto; background: #0e2217; border: 1px solid var(--line-2); border-bottom: 0; border-radius: 28px 28px 0 0; padding: 12px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); animation: up .28s cubic-bezier(.2, .9, .3, 1) both; display: grid; gap: 14px; }
.sheet::before { content: ""; justify-self: center; width: 44px; height: 5px; border-radius: 3px; background: var(--line-2); }
.sheet h2 { font: 900 italic 28px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.sheet .sub { color: var(--ink-2); margin-top: -6px; }
@keyframes fade { from { opacity: 0 } }
@keyframes up { from { transform: translateY(40px); opacity: 0 } }
.pin-dots { display: flex; justify-content: center; gap: 14px; margin: 4px 0; }
.pin-dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-2); transition: all .12s; }
.pin-dots i.on { background: var(--lime); border-color: var(--lime); box-shadow: 0 0 12px var(--lime); }
.pin-dots.bad { animation: shake .4s; }
.pin-dots.bad i { border-color: var(--red); background: var(--red); }
.pad4 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: 0 auto; width: 100%; }
.pad4 button { min-height: 62px; border-radius: 18px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .08); font: 900 italic 30px var(--f-display); }
.pad4 button:active { background: rgba(198, 255, 61, .25); transform: scale(.97); }
.pad4 button.ghost { background: none; border-color: transparent; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.chips-r { display: flex; flex-wrap: wrap; gap: 8px; }
.chips-r button { padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .07); font-weight: 600; font-size: 15px; }
.chips-r button[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
.vals { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.vals button { min-height: 56px; border-radius: 16px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .07); display: grid; place-items: center; font: 900 italic 24px var(--f-display); }
.vals button[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
.cardpick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cardpick button { display: grid; justify-items: center; gap: 6px; padding: 14px 8px 12px; border-radius: 18px; border: 2px solid var(--line-2); background: rgba(255, 255, 255, .06); font: 900 italic 18px/1.05 var(--f-display); text-transform: uppercase; text-align: center; }
.cardpick button small { font: 600 12.5px var(--f-body); letter-spacing: 0; text-transform: none; color: var(--ink-2); }
.cardpick button[aria-pressed="true"].yellow { border-color: var(--yellow); background: rgba(255, 214, 10, .14); }
.cardpick button[aria-pressed="true"].red { border-color: var(--red); background: rgba(255, 90, 82, .16); }

/* ---------- Feier (Vollbild) ---------- */
.celeb { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 50% 38%, #1a4c28, #030a06 75%); animation: fade .25s both; overflow: hidden; }
.celeb.red { background: radial-gradient(circle at 50% 38%, #601614, #0a0303 75%); }
.celeb.yellow { background: radial-gradient(circle at 50% 38%, #5c4e08, #0a0802 75%); }
.rays { position: absolute; left: 50%; top: 38%; width: 190vmax; height: 190vmax; margin: -95vmax 0 0 -95vmax; background: repeating-conic-gradient(from 0deg, rgba(255, 230, 120, .16) 0 7deg, transparent 7deg 22deg); -webkit-mask-image: radial-gradient(circle, #000 4%, transparent 38%); mask-image: radial-gradient(circle, #000 4%, transparent 38%); animation: spin 40s linear infinite; pointer-events: none; }
.celeb.red .rays, .celeb.yellow .rays { display: none; }
@keyframes spin { to { transform: rotate(360deg) } }
.ce-card { position: relative; max-width: 440px; width: 100%; display: grid; justify-items: center; gap: 12px; text-align: center; }
.emblem { display: grid; place-items: center; min-height: 150px; animation: emb .8s cubic-bezier(.2, 1.4, .4, 1) both; filter: drop-shadow(0 12px 22px rgba(0, 0, 0, .5)); }
@keyframes emb { 0% { transform: scale(.2) rotate(-30deg); opacity: 0 } 100% { transform: none; opacity: 1 } }
.emblem .troph { width: 150px; height: 150px; filter: drop-shadow(0 0 22px currentColor); }
.emblem .ball { animation: spinball 3s ease-out both; }
@keyframes spinball { from { transform: rotate(-540deg) } to { transform: rotate(0) } }
.emblem .bigcard { transform: rotate(-8deg); }
.emblem .bigcard .card-ic { height: 170px; width: auto; filter: drop-shadow(0 0 24px currentColor); }
.emblem .st-big { width: 150px; aspect-ratio: 3/4; }
.ce-eyebrow { font: 800 14px var(--f-body); letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
.ce-title { font: 900 italic 58px/.95 var(--f-display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; text-shadow: 0 4px 0 rgba(0, 0, 0, .35); animation: titlein .6s .15s cubic-bezier(.2, 1.3, .4, 1) both; }
.celeb.red .ce-title { color: var(--red); }
.celeb.yellow .ce-title { color: var(--yellow); }
@keyframes titlein { from { transform: scale(.5); opacity: 0 } to { transform: none; opacity: 1 } }
.ce-sub { font: 600 18px/1.3 var(--f-body); color: var(--ink-2); text-wrap: balance; }
.ce-reward { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 14px 16px; border-radius: 18px; background: rgba(255, 210, 60, .13); border: 1px solid rgba(255, 210, 60, .5); }
.ce-reward .gift { font-size: 34px; }
.ce-reward b { display: block; font: 800 12px var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.ce-reward span { font: 700 18px/1.25 var(--f-body); }
.celeb .btn { margin-top: 6px; min-width: 200px; }
.celeb.card-pop .emblem { animation: cardin .7s cubic-bezier(.2, 1.2, .4, 1) both; }
@keyframes cardin { 0% { transform: translateY(-120%) rotate(-40deg); opacity: 0 } 100% { transform: none; opacity: 1 } }

/* ---------- Meldung ---------- */
#toast { position: fixed; left: 0; right: 0; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: grid; justify-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.toast { max-width: 480px; padding: 12px 18px; border-radius: 16px; background: #1d3b29; border: 1px solid var(--line-2); box-shadow: var(--sh); font-weight: 600; text-align: center; animation: toast 3.2s both; }
.toast.warn { background: #4a2a14; border-color: rgba(255, 138, 31, .6); }
@keyframes toast { 0% { transform: translateY(20px); opacity: 0 } 8%, 88% { transform: none; opacity: 1 } 100% { transform: translateY(10px); opacity: 0 } }
/* Bei offenem Fenster oben einblenden, damit der Hinweis den Knopf unten nicht verdeckt. */
body.noscroll #toast { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); }
body.noscroll .toast { animation-name: toast-top; }
@keyframes toast-top { 0% { transform: translateY(-16px); opacity: 0 } 8%, 88% { transform: none; opacity: 1 } 100% { transform: translateY(-8px); opacity: 0 } }
#fx { position: fixed; inset: 0; z-index: 95; pointer-events: none; }

@media (max-width: 380px) {
  .digits { font-size: 78px; }
  .digits .colon { font-size: 54px; }
  .ce-title { font-size: 48px; }
  .stats4 { grid-template-columns: repeat(2, 1fr); }
  .xbtns .xbtn { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .rays { display: none; }
}


/* ---------- Torschuss: Ball, Tor mit Netz, Salve ---------- */
.shotbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 45; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 10px 14px; border-radius: 22px; background: linear-gradient(135deg, #184e28, #0a2014); border: 1px solid rgba(198, 255, 61, .6); box-shadow: 0 12px 30px rgba(0, 0, 0, .5), 0 0 28px rgba(198, 255, 61, .18); }
.shotbtn { display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; text-align: left; position: relative; -webkit-touch-callout: none; }
.shotbtn .ball { flex: none; animation: pulse 1.1s ease-in-out infinite; filter: drop-shadow(0 6px 5px rgba(0, 0, 0, .45)); }
.shotbtn .st { display: grid; gap: 2px; }
.shotbtn b { font: 900 italic 30px/1 var(--f-display); text-transform: uppercase; color: var(--lime); }
.shotbtn small { font-size: 12.5px; color: var(--ink-2); line-height: 1.25; }
.shotbtn .charge { position: absolute; left: -7px; top: -7px; width: 68px; height: 68px; border-radius: 50%; border: 4px solid transparent; pointer-events: none; }
.shotbtn.charging .charge { border-color: var(--lime); animation: charge .6s linear both; box-shadow: 0 0 18px var(--lime); }
.shotbtn.charging .ball { animation: none; transform: scale(.9); }
@keyframes charge { from { transform: scale(1.6); opacity: .15 } to { transform: scale(1); opacity: 1 } }
@keyframes pulse { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.1) } }
.goalbox { position: relative; width: 132px; }
.goalbox .goal { display: block; width: 100%; height: auto; }
.goalbox .netg { transform-box: fill-box; transform-origin: 50% 100%; }
.goalbox.rip .netg { animation: netrip .7s ease-out; }
@keyframes netrip { 0% { transform: scale(1) } 25% { transform: scaleX(1.08) scaleY(.88) } 55% { transform: scaleX(.96) scaleY(1.07) } 100% { transform: scale(1) } }
.goalflash { position: absolute; inset: 0; display: grid; place-items: center; font: 900 italic 32px var(--f-display); text-transform: uppercase; color: var(--lime); opacity: 0; text-shadow: 0 0 14px rgba(198, 255, 61, .9), 0 2px 0 #000; }
.goalbox.rip .goalflash { animation: flash .8s ease-out; }
@keyframes flash { 0% { opacity: 0; transform: scale(.6) } 25% { opacity: 1; transform: scale(1.15) } 100% { opacity: 0; transform: scale(1) } }
.skip { grid-column: 1 / -1; justify-self: end; border: 0; background: none; color: var(--ink-3); font: 600 12.5px var(--f-body); text-decoration: underline; padding: 2px 4px; }
.flyball { position: fixed; left: 0; top: 0; width: 40px; height: 40px; z-index: 96; pointer-events: none; will-change: transform; filter: drop-shadow(0 6px 5px rgba(0, 0, 0, .45)); }
.task.st-ready { border-color: rgba(198, 255, 61, .7); box-shadow: 0 0 0 1px rgba(198, 255, 61, .3), 0 0 24px rgba(198, 255, 61, .18); }
.stamp.ready { color: var(--lime); border-style: dashed; background: rgba(198, 255, 61, .08); animation: pulse 1.1s ease-in-out infinite; }

/* ---------- Belohnungswahl ---------- */
.btn-xs { min-height: 38px; padding: 0 14px; font-size: 15px; }
.picks { display: grid; gap: 6px; margin-top: 6px; }
.pick { text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .06); font-weight: 600; font-size: 14.5px; }
.pick[aria-pressed="true"] { background: rgba(255, 210, 60, .18); border-color: var(--gold); }
.xbtn.wide { grid-column: span 2; }
.xbtn[disabled] { opacity: .4; }
.ev.fair { border-color: rgba(198, 255, 61, .4); }
.ev.fair .evi svg { color: var(--lime); width: 22px; height: 22px; }

/* ---------- Einblendung (wie im Fernsehen) ---------- */
#banner { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 66px); z-index: 65; display: grid; justify-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.bn { display: flex; align-items: center; gap: 12px; max-width: 520px; width: 100%; padding: 12px 16px; border-radius: 18px; background: rgba(8, 24, 15, .97); border: 1px solid var(--line-2); box-shadow: var(--sh); animation: bn 3s both; }
.bn .bn-i { flex: none; display: grid; place-items: center; width: 46px; }
.bn .bn-i svg { width: 38px; height: auto; max-height: 46px; }
.bn .bn-t { display: grid; gap: 1px; min-width: 0; }
.bn b { font: 900 italic 24px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.bn small { font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.bn.lime { border-color: var(--lime); box-shadow: var(--sh), 0 0 26px rgba(198, 255, 61, .22); }
.bn.lime b { color: var(--lime); }
.bn.gold { border-color: var(--gold); }
.bn.gold b { color: var(--gold); }
.bn.yellow { border-color: var(--yellow); background: rgba(36, 30, 4, .97); }
.bn.yellow b { color: var(--yellow); }
.bn.red { border-color: var(--red); background: rgba(40, 10, 8, .97); }
.bn.red b { color: var(--red); }
.bn.blue { border-color: #4f8bff; }
.bn.blue b { color: #8fb4ff; }
@keyframes bn { 0% { transform: translateY(-24px); opacity: 0 } 7%, 91% { transform: none; opacity: 1 } 100% { transform: translateY(-14px); opacity: 0 } }

/* ---------- Fang, Tüten, Glanz ---------- */
@keyframes wobble { 0%, 100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
.sticker.foil { background: linear-gradient(135deg, #ff6ec7, #ffd23c, #6effb2, #4fc3ff, #b48bff, #ff6ec7); background-size: 300% 300%; animation: foil 7s linear infinite; }
@keyframes foil { to { background-position: 300% 300%; } }
.sticker.big { width: min(60vw, 230px); aspect-ratio: 3 / 4; padding: 8px; border-radius: 20px; }
.sticker.big .in { border-radius: 14px; gap: 8px; }
.sticker.big .em { font-size: 84px; }
.sticker.big .nm2 { font-size: 22px; }
.sticker.big .no { font-size: 11px; }
.sticker.big.pop { animation: stpop .8s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes stpop { 0% { transform: scale(.3) rotate(-18deg); opacity: 0 } 100% { transform: none; opacity: 1 } }
.stbig-wrap { display: grid; justify-items: center; }

/* ---------- Feier: Tüte ---------- */
.ce-title.small { font-size: 40px; }
.celeb.pack .packbtn { border: 0; background: none; padding: 0; animation: wobble 1.6s ease-in-out infinite; filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .55)); }
.celeb.pack .packbtn.tearing { animation: tear .9s ease-in forwards; }
@keyframes tear { 0% { transform: scale(1) rotate(0) } 20% { transform: scale(1.08) rotate(-6deg) } 40% { transform: scale(1.1) rotate(6deg) } 100% { transform: scale(1.6) rotate(0); opacity: 0 } }

/* ---------- Fenster: Regelbuch, Einlauf, Karten ---------- */
.sheet h2.h-card { display: flex; align-items: center; gap: 12px; }
.sheet h2.h-card .card-ic { flex: none; }
.rb h3 { font: 900 italic 21px var(--f-display); text-transform: uppercase; margin: 14px 0 4px; display: flex; align-items: center; gap: 8px; }
.rb p { color: var(--ink-2); margin: 4px 0 6px; }
.rb p b, .rb li b { color: var(--ink); }
.rb-list { display: grid; gap: 4px; padding-left: 18px; list-style: disc; color: var(--ink-2); }
.rb-ol { display: grid; gap: 10px; padding-left: 20px; color: var(--ink-2); font-size: 15px; line-height: 1.35; }
.rb-ol b { color: var(--ink); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw-c { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; background: var(--c); box-shadow: 0 0 0 1px var(--line-2) inset; }
.sw-c[aria-pressed="true"] { border-color: var(--lime); box-shadow: 0 0 0 3px #0e2217 inset, 0 0 14px rgba(198, 255, 61, .5); }
.ob-prev { display: flex; align-items: center; gap: 14px; }
.ob-prev .disp { font-size: 34px; }
.adv { display: grid; gap: 8px; padding-left: 18px; list-style: disc; color: var(--ink-2); font-size: 14.5px; }
.warn-box b { color: var(--ink); }

/* ---------- Karten-Marken, Ziele, Trainer-Sprung ---------- */
.cflag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 7px; border-radius: 999px; font: 800 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; }
.cflag .card-ic { height: 18px; width: auto; }
.cflag.yellow { background: rgba(255, 214, 10, .16); border: 1px solid rgba(255, 214, 10, .6); color: var(--yellow); }
.cflag.red { background: rgba(255, 90, 82, .16); border: 1px solid rgba(255, 90, 82, .65); color: #ff9a94; }
.cflag.minus { padding-left: 10px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); text-transform: none; letter-spacing: .02em; font-size: 13px; }
.nmrow { display: flex; align-items: center; gap: 6px; min-width: 0; }
.hflag { display: inline-grid; place-items: center; flex: none; }
.hflag .card-ic { height: 24px; width: auto; filter: drop-shadow(0 0 6px currentColor); }
.weekcards .wc { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.coach-sec { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 78px); }
.chips-r.jump, .chips-r.ideas { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Konto ---------- */
.konto-hero { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 18px; border-color: rgba(255, 210, 60, .45); background: linear-gradient(135deg, #3b2d0b, #17130a 72%); }
.konto-hero .kh-ico { display: grid; place-items: center; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .45)); }
.kh-tx { display: grid; gap: 4px; min-width: 0; }
.kh-sum { font: 900 italic 52px/1 var(--f-display); color: var(--gold); text-shadow: 0 0 24px rgba(255, 210, 60, .35), 0 3px 0 rgba(0, 0, 0, .4); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kh-sum.zero { color: var(--ink-2); text-shadow: none; }
.kh-tx small { color: var(--ink-2); font-size: 14px; line-height: 1.3; }
.kbtns { grid-template-columns: 1fr 1fr; }
.kbtns .xbtn svg { width: 28px; height: 28px; }
.kbtns .k-note svg { color: var(--gold); }
.ev.kb .evv { color: var(--ink); white-space: nowrap; }
.ev.kb.good { border-color: rgba(198, 255, 61, .4); }
.ev.kb.good .evv { color: var(--lime); }
.ev.kb.pay { border-color: rgba(255, 210, 60, .45); }
.ev.kb.pay .evv, .ev.kb.pay .evi svg { color: var(--gold); }
.ev.kb .evi svg { width: 24px; height: 24px; }
.gbadge { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: #3a2a06; font: 900 italic 17px/1 var(--f-display); }
.vals.grades { gap: 8px; }
.vals.grades button { min-height: 64px; padding: 4px 0; align-content: center; gap: 2px; }
.vals.grades button b { font: 900 italic 26px/1 var(--f-display); }
.vals.grades button small { font: 700 11px/1 var(--f-body); letter-spacing: 0; opacity: .85; white-space: nowrap; }
.kline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.kline > span { font-weight: 700; }

/* ---------- Feinschliff nach der Sichtprüfung ---------- */
.celeb .row-btns { justify-content: center; }
.sheet .sticky-act { position: sticky; bottom: 0; z-index: 2; box-shadow: 0 -14px 16px -2px #0e2217, 0 6px 0 var(--lime-deep); }
.tab .dot-badge.lime { background: var(--lime); color: var(--lime-ink); }

/* ---------- v4: Karten ganz oben, Karten in Woche und Tagesleiste ---------- */
.cardtop { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 14px; padding: 10px 16px; border-radius: 18px; border: 1px solid; }
.cardtop.yellow { background: rgba(255, 214, 10, .13); border-color: rgba(255, 214, 10, .65); }
.cardtop.red { background: rgba(255, 90, 82, .14); border-color: rgba(255, 90, 82, .7); }
.cardtop .card-ic { height: 36px; width: auto; filter: drop-shadow(0 0 10px currentColor); }
.cardtop .ct-tx { display: grid; gap: 1px; min-width: 0; }
.cardtop b { font: 900 italic 22px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.cardtop.yellow b { color: var(--yellow); }
.cardtop.red b { color: #ff9a94; }
.cardtop small { font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.pcards { position: absolute; top: 5px; right: 5px; display: flex; gap: 2px; pointer-events: none; }
.pcard { display: block; width: 6px; height: 9px; border-radius: 1.5px; transform: rotate(8deg); }
.pcard.y { background: var(--yellow); }
.pcard.r { background: var(--red); }
.dcards { display: inline-flex; align-items: center; gap: 1px; margin-right: 2px; }
.dcards .card-ic { height: 17px; width: auto; }
.dcards em { font: 800 11px var(--f-body); font-style: normal; color: var(--ink-2); margin-left: 2px; }
.dcards .dminus { font: 800 12px var(--f-body); color: #ff9a94; margin-left: 3px; font-variant-numeric: tabular-nums; }
.ev-act { grid-column: 1 / -1; display: flex; justify-content: flex-end; border-top: 1px dashed var(--line); padding-top: 8px; }

/* ---------- v4: Nächstes Ziel (Heute) ---------- */
.nextgoal { display: grid; gap: 10px; width: 100%; padding: 14px 16px; text-align: left; color: var(--ink); font: inherit; }
.ng-wait { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: rgba(255, 210, 60, .12); border: 1px solid rgba(255, 210, 60, .45); font-size: 14.5px; color: var(--ink-2); }
.ng-wait b { color: var(--gold); }
.ng-wait .troph { flex: none; }
.ng-main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.ng-ico { display: grid; place-items: center; width: 50px; }
.ng-ico .troph { width: 46px; height: 46px; }
.ng-tx b { display: block; font: 900 italic 24px/1.05 var(--f-display); text-transform: uppercase; }
.ng-tx small { display: block; margin-top: 2px; font: 600 14px/1.25 var(--f-body); color: var(--ink-2); }
.ng-cnt { font: 900 italic 22px/1 var(--f-display); color: var(--lime); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ng-cnt i { font-style: normal; color: var(--ink-3); margin: 0 1px; }
.ng-bar { display: block; height: 8px; border-radius: 6px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.ng-bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #7fd11a, var(--lime)); box-shadow: 0 0 10px rgba(198, 255, 61, .5); }
.ng-note { font: 600 13px/1.3 var(--f-body); color: var(--ink-3); }
.ng-pack { display: flex; align-items: center; gap: 10px; padding-top: 10px; border-top: 1px dashed var(--line-2); font-size: 14.5px; color: var(--ink-2); }
.ng-pack b { color: var(--ink); }
.ng-pack .packsvg { flex: none; }

/* ---------- v4: Erfolge ---------- */
.tally { display: grid; gap: 6px; padding: 12px 16px; }
.ty-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 15px; color: var(--ink-2); }
.ty-row b { font: 900 italic 22px/1 var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; }
.ty-row.minus b { color: #ff9a94; }
.ty-row.sum { margin-top: 2px; padding-top: 8px; border-top: 1px dashed var(--line-2); color: var(--ink); font-weight: 700; }
.ty-row.sum b { color: var(--lime); font-size: 26px; }
.packline { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px; align-items: center; padding-top: 12px; border-top: 1px dashed var(--line-2); }
.packline .pl-tx { display: grid; gap: 2px; min-width: 0; }
.packline .pl-tx b { font: 900 italic 22px/1.05 var(--f-display); text-transform: uppercase; }
.packline small { font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.packline small b { font: 800 14px var(--f-body); color: var(--ink); }
.packline .btn { grid-column: 1 / -1; }
.packline.has .pl-tx b { color: var(--gold); }
.packline.has .pl-ico { animation: wobble 2.4s ease-in-out infinite; }
.tier .tn-s { font: 700 15px var(--f-display); letter-spacing: .08em; color: var(--ink-3); }
.gbar { height: 6px; border-radius: 6px; background: rgba(255, 255, 255, .12); overflow: hidden; margin-top: 8px; }
.gbar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #7fd11a, var(--lime)); }
.stpoints { padding: 14px 16px 16px; display: grid; gap: 10px; }
.sp-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sp-n b { display: block; font: 900 italic 46px/.9 var(--f-display); color: var(--gold); font-variant-numeric: tabular-nums; }
.sp-n span { font: 700 12px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.sp-bonus { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; align-items: center; column-gap: 8px; padding: 8px 14px 8px 10px; border-radius: 16px; background: rgba(198, 255, 61, .1); border: 1px solid rgba(198, 255, 61, .45); }
.sp-bonus .sp-ball { grid-row: 1 / 3; display: grid; }
.sp-bonus b { font: 900 italic 28px/1 var(--f-display); color: var(--lime); }
.sp-bonus > span:last-child { font: 700 11.5px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.sp-bar .fill { background: linear-gradient(90deg, #e6a100, var(--gold)); box-shadow: 0 0 14px rgba(255, 210, 60, .5); }
.sp-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--ink-2); }
.sp-legend li { display: flex; align-items: center; gap: 7px; }
.sp-legend b { color: var(--ink); }
.rsw { display: inline-block; width: 13px; height: 17px; border-radius: 4px; flex: none; }
.rsw.n { background: linear-gradient(135deg, #ffe58a, #ff9a3c); }
.rsw.r { background: linear-gradient(135deg, #e8f4ff, #5a9cf0); }
.rsw.u { background: linear-gradient(135deg, #ff6ad5, #8f6bff 45%, #3fd7ff); }
.rar-h h3 { font: 900 italic 22px var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.rar-h.r-n h3 { color: var(--gold); }
.rar-h.r-r h3 { color: #8fc6ff; }
.rar-h.r-u h3 { color: #d3a8ff; }

/* Sticker nach Seltenheit: normal = Gold, selten = Blau-Silber, ultraselten = schillernd */
.sticker .pt { position: absolute; top: 3px; right: 3px; width: 17px; height: 17px; border-radius: 50%; background: #3a2400; color: #ffd23c; font: 900 11px/17px var(--f-body); text-align: center; pointer-events: none; }
.sticker.r-r.got { background: linear-gradient(135deg, #e8f4ff, #6fb4ff 40%, #dff0ff 60%, #5a9cf0); box-shadow: 0 8px 20px rgba(90, 160, 255, .3); }
.sticker.r-r.got .in { background: linear-gradient(180deg, #f6fbff, #d6e9ff); }
.sticker.r-r.got .no { color: #3a5f8f; }
.sticker.r-r.got .nm2 { color: #0f2a4a; }
.sticker.r-r.got .pt { background: #0f2c55; color: #a8d4ff; }
.sticker.r-r.got::after { background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, .7) 48%, transparent 58%); }
.sticker.r-u.got { background: linear-gradient(135deg, #ff6ad5, #8f6bff 30%, #3fd7ff 55%, #ffe46b 80%, #ff6ad5); background-size: 250% 250%; animation: foil 6s linear infinite; box-shadow: 0 8px 24px rgba(160, 110, 255, .5); }
.sticker.r-u.got .in { background: linear-gradient(180deg, #2c1656, #160a30); }
.sticker.r-u.got .no { color: #d9c8ff; }
.sticker.r-u.got .nm2 { color: #fff; }
.sticker.r-u.got .pt { background: #ffe46b; color: #2a1450; }
.sticker.r-u.got.new, .sticker.r-u.got.big.pop { animation: foil 6s linear infinite, stpop .8s cubic-bezier(.2, 1.4, .4, 1) both; }
.sticker.r-r.lock { border-color: rgba(111, 180, 255, .5); }
.sticker.r-r.lock .in { background: #0b1c2c; }
.sticker.r-u.lock { border-color: rgba(185, 130, 255, .6); box-shadow: inset 0 0 14px rgba(160, 110, 255, .3); }
.sticker.r-u.lock .in { background: #150f27; }
.sticker.foil.r-n, .sticker.foil.r-r, .sticker.foil.r-u { background: linear-gradient(135deg, #ff6ec7, #ffd23c, #6effb2, #4fc3ff, #b48bff, #ff6ec7); background-size: 300% 300%; animation: foil 7s linear infinite; }
.sticker.big .pt { top: 10px; right: 10px; width: 30px; height: 30px; font-size: 18px; line-height: 30px; }
.celeb.pack.open.r-r { background: radial-gradient(circle at 50% 38%, #123a66, #030a10 75%); }
.celeb.pack.open.r-u { background: radial-gradient(circle at 50% 38%, #4a1f8a, #07030f 75%); }
.celeb.pack.open.r-r .ce-eyebrow { color: #8fc6ff; }
.celeb.pack.open.r-u .ce-eyebrow { color: #e3c2ff; font-size: 17px; }
.ce-sub.sp-line { font-size: 15px; }
.ce-sub.sp-line b { color: var(--ink); }
.ce-sub.sp-line b.bonus { color: var(--lime); }

/* ---------- v4: antippbare Einblendung ---------- */
button.bn { font: inherit; color: inherit; text-align: left; cursor: pointer; }
.bn.go { pointer-events: auto; padding-right: 10px; }
.bn .bn-arrow { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: rgba(255, 255, 255, .14); margin-left: auto; }
.bn .bn-arrow svg { width: 16px; height: 16px; }

/* ---------- v4: Eigener Grund, Kein Tor als Eintrag ---------- */
.xbtn small { font: 600 12.5px/1.2 var(--f-body); text-transform: none; letter-spacing: 0; color: var(--ink-3); text-align: center; }
.xbtn.wide svg { width: 28px; height: 28px; color: var(--lime); }
.ev.no { border-color: rgba(255, 138, 31, .5); background: rgba(255, 138, 31, .08); }
.ev.no .evi svg { width: 22px; height: 22px; color: var(--ember); }
.ev.no .evv { color: var(--ember); }
.sheet .seg { margin-top: 0; }
.xbtns.x2 { grid-template-columns: repeat(2, 1fr); }

/* ---------- v4: Ziele als Liste ---------- */

/* Ziele bereinigen: nach Tore sortiert, jede Zahl nur einmal, Belohnung als Text. Ohne brauchbare Liste gelten die Standard-Ziele. */
function normGoals(list, dflt) {
  const out = [], used = {};
  (Array.isArray(list) ? list : []).forEach(g => {
    const at = Math.round(+(g && g.at));
    if (!isFinite(at) || at < 1 || at > 100000) return;
    let id = String((g && g.id) || 'g' + at); while (used[id]) id += 'x';
    used[id] = 1;
    out.push({ id, at, reward: String(g.reward == null ? '' : g.reward).slice(0, 120) });
  });
  out.sort((a, b) => a.at - b.at);
  for (let i = 1; i < out.length; i++) if (out[i].at <= out[i - 1].at) out[i].at = out[i - 1].at + 1;
  return out.length ? out : dflt.map(g => Object.assign({}, g));
}
const clampInt = (v, a, b, dflt) => { const n = Math.round(+v); return isFinite(n) ? Math.max(a, Math.min(b, n)) : dflt; };

/* Aufgabenliste von Version 3 auf die neue Liste umstellen, ohne den Verlauf zu verändern und ohne vom Datum abzuhängen:
   - gleiche Nummer (id) = dieselbe Aufgabe, nur umbenannt: Bisherige Tore bleiben dabei.
   - alte Standard-Aufgaben ohne Gegenstück („Ehrlich geblieben“, „Gute Note“) laufen aus: Bereits gewertete Tage zählen weiter.
   - neue Aufgaben gelten erst ab NEW_TASKS_FROM, damit frühere Tage nicht plötzlich offene Aufgaben haben.
   - eigene Aufgaben des Trainers bleiben unverändert. */
const NEW_TASKS_FROM = '2026-10-30';

function migrateTasks(stored, fresh) {
  const byId = {};
  stored.forEach(t => { byId[t.id] = t; });
  const out = fresh.map(nt => {
    const o = byId[nt.id];
    if (!o) return Object.assign({}, nt, { from: NEW_TASKS_FROM });
    delete byId[nt.id];
    const m = Object.assign({}, o, { icon: nt.icon, title: nt.title, sub: nt.sub, pts: nt.pts, bonus: nt.bonus, days: nt.days.slice() });
    delete m.until;
    return m;
  });
  stored.forEach(t => {
    if (!byId[t.id]) return;
    out.push(OLD_DEFAULT_IDS.indexOf(t.id) >= 0 ? Object.assign({}, t, { until: t.until || RETIRED_UNTIL }) : t);
  });
  return out;
}
